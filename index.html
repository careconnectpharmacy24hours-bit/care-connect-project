<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Care Connect | Welcome</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            font-family: Arial, sans-serif;
            position: relative;
            z-index: 1;
        }
        /* THIS FINDS YOUR IMAGE IN THE "image" FOLDER AND MAKES IT 50% TRANSPARENT */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url('image/logo.png'); 
            background-size: cover;
            background-position: center;
            opacity: 0.5;
            z-index: -1;
        }
        .landing-box {
            text-align: center;
            color: white;
        }
        .landing-box h1 {
            font-size: 55px;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .get-started-btn {
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            background-color: #007bff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .get-started-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="landing-box">
        <h1>CARE CONNECT</h1>
        <a href="login.html" class="get-started-btn">Get Started</a>
    </div>
</body>
</html>
