<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Care Connect | My Account</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Edit Profile Modal Styling */
        .edit-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;
        }
        .edit-content {
            background: white; padding: 30px; border-radius: 12px; width: 100%; max-width: 400px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .edit-content h3 { margin-top: 0; color: #007bff; text-align: center; margin-bottom: 20px; }
        .edit-input {
            width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ddd;
            border-radius: 6px; box-sizing: border-box; font-size: 14px;
        }
        .modal-btns { display: flex; justify-content: space-between; margin-top: 10px; }
    </style>
</head>
<body>

    <!-- Navigation Menu -->
    <nav class="navbar">
        <a href="home.html" class="nav-logo" style="display: flex; align-items: center; text-decoration: none; color: white;">
            <img src="image/logo2.png" alt="Care Connect Logo" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover; margin-right: 12px;">
            <span style="font-weight: bold; font-size: 20px; letter-spacing: 0.5px;">CARE CONNECT</span>
        </a>
        <ul class="nav-links">
            <li><a href="home.html">Home</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="shop.html">Medicines</a></li>
            <li><a href="scanner.html">AI Scanner</a></li>
            <li><a href="cart.html">Cart</a></li>
            <li><a href="account.html">My Account</a></li>
        </ul>
    </nav>
    <!-- Account Details Section -->
    <div class="account-container">
        <div class="profile-header">
            <div class="profile-avatar">👤</div>
            <h2 id="display-greeting">Welcome, User</h2>
            <p id="display-email">user@email.com</p>
        </div>

        <div class="account-grid">
            <div class="account-card">
                <h3>Profile Details</h3>
                <p><strong>Full Name:</strong> <span id="display-fullname">N/A</span></p>
                <p><strong>Phone:</strong> <span id="display-phone">N/A</span></p>
                <p><strong>Address:</strong> <span id="display-address">N/A</span></p>
                <!-- Button now triggers the modal -->
                <button class="btn-primary edit-btn" onclick="openEditModal()">Edit Profile</button>
            </div>

            <div class="account-card">
                <h3>Recent Orders</h3>
                <ul class="order-list">
                    <li>
                        <span>Order #1024</span> 
                        <span class="order-price">₹135.00</span> 
                        <span class="status-badge">Delivered</span>
                    </li>
                </ul>
            </div>
        </div>

        <div class="logout-section">
            <button class="btn-secondary" onclick="logout()">Log Out</button>
        </div>
    </div>

    <!-- Edit Profile Modal Form -->
    <div id="edit-modal" class="edit-modal">
        <div class="edit-content">
            <h3>Edit Your Profile</h3>
            
            <label>Full Name</label>
            <input type="text" id="edit-name" class="edit-input" placeholder="Your Full Name">
            
            <label>Phone Number</label>
            <input type="tel" id="edit-phone" class="edit-input" placeholder="Your Phone Number">
            
            <label>Delivery Address</label>
            <textarea id="edit-address" class="edit-input" rows="3" placeholder="Your Address"></textarea>
            
            <div class="modal-btns">
                <button class="btn-secondary" onclick="closeEditModal()">Cancel</button>
                <button class="btn-primary" onclick="saveProfile()">Save Changes</button>
            </div>
        </div>
    </div>

    <script>
        // Function to load details from memory onto the page
        function loadProfileData() {
            const name = localStorage.getItem("careConnectName") || "Guest User";
            const email = localStorage.getItem("careConnectEmail") || "No email provided";
            const phone = localStorage.getItem("careConnectPhone") || "Not provided";
            const address = localStorage.getItem("careConnectAddress") || "Not provided";

            // Inject the data into the HTML
            document.getElementById("display-greeting").innerText = "Welcome, " + name.split(" ")[0]; 
            document.getElementById("display-fullname").innerText = name;
            document.getElementById("display-email").innerText = email;
            document.getElementById("display-phone").innerText = phone;
            document.getElementById("display-address").innerText = address;
        }

        // 1. When the page loads, display the current profile
        window.onload = function() {
            loadProfileData();
        };

        // 2. Open the edit modal and pre-fill current data
        function openEditModal() {
            document.getElementById("edit-name").value = localStorage.getItem("careConnectName") || "";
            document.getElementById("edit-phone").value = localStorage.getItem("careConnectPhone") || "";
            document.getElementById("edit-address").value = localStorage.getItem("careConnectAddress") || "";
            
            document.getElementById("edit-modal").style.display = "flex";
        }

        // 3. Close the modal
        function closeEditModal() {
            document.getElementById("edit-modal").style.display = "none";
        }

        // 4. Save new data to memory and refresh the screen
        function saveProfile() {
            const newName = document.getElementById("edit-name").value;
            const newPhone = document.getElementById("edit-phone").value;
            const newAddress = document.getElementById("edit-address").value;

            if(!newName || !newPhone || !newAddress) {
                alert("Please fill out all fields!");
                return;
            }

            // Save to localStorage
            localStorage.setItem("careConnectName", newName);
            localStorage.setItem("careConnectPhone", newPhone);
            localStorage.setItem("careConnectAddress", newAddress);

            // Refresh the display immediately
            loadProfileData();
            closeEditModal();
            alert("Profile updated successfully!");
        }

        // 5. Clear memory and return to the starting page
        function logout() {
            localStorage.removeItem("careConnectName");
            localStorage.removeItem("careConnectEmail");
            localStorage.removeItem("careConnectPhone");
            localStorage.removeItem("careConnectAddress");
            
            alert("Logged out successfully.");
            
            // Returns the customer to your starting login/index page
            window.location.href = "index.html"; 
        }
    </script>

</body>
</html>
