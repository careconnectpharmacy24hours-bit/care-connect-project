<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Care Connect | Cart</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Checkout Modal/Container Styling */
        .checkout-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center; align-items: center;
            z-index: 1000;
        }
        .checkout-content {
            background: white; padding: 30px; border-radius: 12px;
            width: 100%; max-width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .checkout-content h3 { color: #007bff; margin-top: 0; margin-bottom: 20px; text-align: center; }
        .form-input {
            width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ddd;
            border-radius: 6px; box-sizing: border-box; font-size: 14px;
        }
        .payment-option {
            display: block; margin-bottom: 12px; font-size: 15px; cursor: pointer;
        }
        .payment-option input { margin-right: 10px; }
        .modal-btns { display: flex; justify-content: space-between; margin-top: 20px; }
    </style>
</head>
<body>

    <!-- Navigation Menu -->
   <nav class="navbar">
        <a href="home.html" class="nav-logo" style="display: flex; align-items: center; text-decoration: none; color: white;">
            <img src="image/logo2.png" alt="Care Connect Logo" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover; margin-right: 12px;">
            <span style="font-weight: bold; font-size: 20px; letter-spacing: 0.5px;">CARE CONNECT</span>
        </a>
        <ul class="nav-links">
            <li><a href="home.html">Home</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="shop.html">Medicines</a></li>
            <li><a href="scanner.html">AI Scanner</a></li>
            <li><a href="cart.html">Cart</a></li>
            <li><a href="account.html">My Account</a></li>
        </ul>
    </nav>
    <!-- Cart Content -->
    <div class="cart-container">
        <h2>Your Shopping Cart</h2>
        
        <div id="cart-items" class="cart-items-list">
            <!-- JavaScript will automatically inject the selected medicines here -->
        </div>

        <div class="cart-summary">
            <h3>Total: ₹<span id="cart-total">0.00</span></h3>
            <button class="btn-primary checkout-btn" onclick="openAddressModal()">Proceed to Checkout</button>
            <button class="btn-secondary clear-btn" onclick="clearCart()">Clear Cart</button>
        </div>
    </div>

    <!-- STEP 1: Address Modal Form -->
    <div id="address-modal" class="checkout-modal">
        <div class="checkout-content">
            <h3>Enter Delivery Address</h3>
            <input type="text" id="cust-name" class="form-input" placeholder="Full Name" required>
            <input type="text" id="cust-phone" class="form-input" placeholder="Phone Number" required>
            <textarea id="cust-address" class="form-input" rows="3" placeholder="Street Address, City, Pincode" required></textarea>
            
            <div class="modal-btns">
                <button class="btn-secondary" onclick="closeModals()">Cancel</button>
                <button class="btn-primary" onclick="proceedToPayment()">Proceed to Payment</button>
            </div>
        </div>
    </div>

    <!-- STEP 2: Payment Method Modal Form -->
    <div id="payment-modal" class="checkout-modal">
        <div class="checkout-content">
            <h3>Select Payment Method</h3>
            
            <label class="payment-option"><input type="radio" name="payment" value="UPI"> UPI ID / QR</label>
            <label class="payment-option"><input type="radio" name="payment" value="GooglePay"> Google Pay</label>
            <label class="payment-option"><input type="radio" name="payment" value="PhonePe"> PhonePe</label>
            <label class="payment-option"><input type="radio" name="payment" value="Paytm"> Paytm</label>
            <label class="payment-option"><input type="radio" name="payment" value="NetBanking"> Net Banking</label>
            <label class="payment-option"><input type="radio" name="payment" value="COD" checked> Cash on Delivery (COD)</label>

            <div class="modal-btns">
                <button class="btn-secondary" onclick="openAddressModal()">Back</button>
                <button class="btn-primary" onclick="completeCheckout()">Pay & Complete Order</button>
            </div>
        </div>
    </div>

    <script>
        window.onload = function() {
            displayCart();
        };

        function displayCart() {
            let cart = JSON.parse(localStorage.getItem('careConnectCart')) || [];
            let cartDiv = document.getElementById("cart-items");
            let totalSpan = document.getElementById("cart-total");
            let total = 0;

            cartDiv.innerHTML = "";

            if (cart.length === 0) {
                cartDiv.innerHTML = "<p>Your cart is empty. Go add some medicines!</p>";
                totalSpan.innerText = "0.00";
                return;
            }

            cart.forEach((item) => {
                let itemDiv = document.createElement("div");
                itemDiv.className = "cart-item";
                itemDiv.innerHTML = `
                    <span class="item-name">${item.name}</span>
                    <span class="item-price">₹${item.price.toFixed(2)}</span>
                `;
                cartDiv.appendChild(itemDiv);
                total += item.price;
            });

            totalSpan.innerText = total.toFixed(2);
        }

        function clearCart() {
            localStorage.removeItem('careConnectCart');
            displayCart();
        }

        function openAddressModal() {
            let cart = JSON.parse(localStorage.getItem('careConnectCart')) || [];
            if(cart.length === 0) {
                alert("Your cart is empty!");
                return;
            }
            closeModals();
            document.getElementById("address-modal").style.display = "flex";
        }

        function proceedToPayment() {
            const name = document.getElementById("cust-name").value;
            const phone = document.getElementById("cust-phone").value;
            const address = document.getElementById("cust-address").value;

            if(!name || !phone || !address) {
                alert("Please fill in all delivery address details!");
                return;
            }

            // Save address temporarily
            localStorage.setItem("careConnectPhone", phone);
            localStorage.setItem("careConnectAddress", address);

            closeModals();
            document.getElementById("payment-modal").style.display = "flex";
        }

        function closeModals() {
            document.getElementById("address-modal").style.display = "none";
            document.getElementById("payment-modal").style.display = "none";
        }

        function completeCheckout() {
            const selectedPayment = document.querySelector('input[name="payment"]:checked').value;

            closeModals();

            if (selectedPayment === "COD") {
                alert("Thanks for choosing Care Connect. Your order has been placed successfully!");
            } else {
                alert("Payment Done Successfully via " + selectedPayment + "! Thank you for trusting Care Connect.");
            }

            clearCart(); // Empties cart after successful checkout
        }
    </script>

</body>
</html>
